name: Deploy Arc

on:
  workflow_dispatch:
    inputs:
      arc_ref:
        description: Arc tag or commit to deploy
        required: true
        default: v0.14.0
        type: string

concurrency:
  group: deploy-arc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hudsonkit/arc
          ref: ${{ inputs.arc_ref }}
          path: arc-source
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Arc dependencies
        working-directory: arc-source
        run: bun install --frozen-lockfile
      - name: Build canonical Arc site
        working-directory: arc-source
        env:
          ARC_BASE: /arc/
          SITE_URL: https://hudsonkit.com/arc
          GA_MEASUREMENT_ID: G-SEDXMKVG9K
        run: |
          bun run build:lib
          bun run build:site
          git rev-parse HEAD > dist/deployed-commit.txt
      - name: Prepare independent assets
        run: |
          mkdir -p apps/web/site/arc-out/arc
          cp -R arc-source/dist/. apps/web/site/arc-out/arc/
      - name: Save deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: arc-site
          path: apps/web/site/arc-out
      - name: Deploy Arc worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler@4 deploy --config wrangler.arc.jsonc
